server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/funcionarios/ {
        proxy_pass http://ms-funcionarios:8000;
    }

    location /api/v1/produtos/ {
        proxy_pass http://ms-produtos:8001;
    }

    location /api/v1/vendas/ {
        proxy_pass http://ms-vendas:8001;
    }
}