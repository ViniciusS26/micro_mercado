apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-funcionarios
  namespace: mercado
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-funcionarios
  template:
    metadata:
      labels:
        app: ms-funcionarios
    spec:
      containers:
        - name: api
          image: api-mercado/ms-funcionarios:atividade4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgrespassword@db-funcionarios:5432/db_funcionarios
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ms-funcionarios
  namespace: mercado
  labels:
    app: ms-funcionarios
spec:
  selector:
    app: ms-funcionarios
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ms-funcionarios
  namespace: mercado
  labels:
    release: monitoring-stack
spec:
  selector:
    matchLabels:
      app: ms-funcionarios
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
