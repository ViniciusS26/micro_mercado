version: '3.8'

networks:
  sgm-network:
    driver: bridge


services:

  # ==========================================
  # MS FUNCIONÁRIOS
  # ==========================================
  db-funcionarios:
    image: postgres:15-alpine
    container_name: db-funcionarios
    environment:
      POSTGRES_DB: db_funcionarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - db_funcionarios_data:/var/lib/postgresql/data
    networks:
      - sgm-network
    ports:
      - 5431:5431

  ms-funcionarios:
    build:
      context: ./src/services/ms-funcionarios
      dockerfile: Dockerfile
    container_name: ms-funcionarios
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db-funcionarios:5432/db_funcionarios
    depends_on:
      - db-funcionarios
    networks:
      - sgm-network
    ports:
      - 8000:8000

volumes:
  db_funcionarios_data:

