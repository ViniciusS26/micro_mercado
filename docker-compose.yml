version: '3.8'

networks:
  sgm-network:
    driver: bridge


services:

  # ==========================================
  # MS FUNCIONÁRIOS
  # ==========================================
  db-funcionarios:
    image: postgres:15-alpine
    container_name: db-funcionarios
    environment:
      POSTGRES_DB: db_funcionarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - db_funcionarios_data:/var/lib/postgresql/data
    networks:
      - sgm-network
    ports:
      - 5431:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_funcionarios"]
      interval: 5s
      timeout: 3s
      retries: 10

  ms-funcionarios:
    build:
      context: ./src/services/ms-funcionarios
      dockerfile: Dockerfile
    container_name: ms-funcionarios
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db-funcionarios:5432/db_funcionarios
    depends_on:
      db-funcionarios:
        condition: service_healthy
    networks:
      - sgm-network
    volumes:
      - ./src/services/ms-funcionarios/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  
  # ==========================================
  # MS PRODUTOS
  # ==========================================
  db-produtos:
    image: postgres:15-alpine
    container_name: db-produtos
    environment:
      POSTGRES_DB: db_produtos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - db_produtos_data:/var/lib/postgresql/data
    networks:
      - sgm-network
    ports:
      - 5432:5432

  ms-produtos:
    build:
      context: ./src/services/ms-produtos
      dockerfile: Dockerfile
    container_name: ms-produtos
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db-produtos:5432/db_produtos
    depends_on:
      - db-produtos
    networks:
      - sgm-network
    volumes:
      - ./src/services/ms-produtos/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
  
  db-vendas:
    image: postgres:15-alpine
    container_name: db-vendas
    environment:
      POSTGRES_DB: db_vendas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - db_vendas_data:/var/lib/postgresql/data
    networks:
      - sgm-network
    ports:
      - 5433:5432

  ms-vendas:
    build:
      context: ./src/services/ms-vendas
      dockerfile: Dockerfile
    container_name: ms-vendas
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db-vendas:5432/db_vendas
    depends_on:
      - db-vendas
    networks:
      - sgm-network
    volumes:
      - ./src/services/ms-vendas/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  nginx:
      image: nginx:alpine
      ports:
        - "8080:80"
      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
        - ms-funcionarios
        - ms-produtos
        - ms-vendas
      networks:
        - sgm-network
volumes:
  db_funcionarios_data:
  db_produtos_data:
  db_vendas_data:

