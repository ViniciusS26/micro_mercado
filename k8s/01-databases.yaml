apiVersion: v1
kind: Namespace
metadata:
  name: mercado
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: mercado
type: Opaque
stringData:
  username: postgres
  password: postgrespassword
---
apiVersion: v1
kind: Service
metadata:
  name: db-funcionarios
  namespace: mercado
  labels:
    app: db-funcionarios
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: db-funcionarios
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-funcionarios
  namespace: mercado
spec:
  serviceName: db-funcionarios
  replicas: 1
  selector:
    matchLabels:
      app: db-funcionarios
  template:
    metadata:
      labels:
        app: db-funcionarios
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: db_funcionarios
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d db_funcionarios"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d db_funcionarios"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
